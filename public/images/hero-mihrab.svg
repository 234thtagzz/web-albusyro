<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Ornamen geometris mihrab dengan mushaf terbuka">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <pattern id="lattice" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M42 10 L54 30 L74 42 L54 54 L42 74 L30 54 L10 42 L30 30 Z" fill="none" stroke="#ecfdf5" stroke-opacity="0.14"/>
      <circle cx="42" cy="42" r="2" fill="#ecfdf5" fill-opacity="0.12"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#022c22" stop-opacity="0.38"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#field)"/>
  <rect width="800" height="1000" fill="url(#lattice)"/>

  <!-- Mihrab arch -->
  <path d="M400 176 C506 292 552 396 552 586 L552 772 L248 772 L248 586 C248 396 294 292 400 176 Z"
        fill="#ecfdf5" fill-opacity="0.05" stroke="#ecfdf5" stroke-opacity="0.34" stroke-width="2.5"/>
  <path d="M400 214 C488 316 526 408 526 586 L526 746 L274 746 L274 586 C274 408 312 316 400 214 Z"
        fill="none" stroke="#ecfdf5" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- Khatam star at the apex -->
  <g transform="translate(400 322)" stroke="#d97706" fill="none">
    <rect x="-17" y="-17" width="34" height="34" stroke-width="2"/>
    <rect x="-17" y="-17" width="34" height="34" transform="rotate(45)" stroke-width="2"/>
  </g>

  <!-- Open mushaf -->
  <g transform="translate(400 664)">
    <g transform="rotate(-4)">
      <rect x="-158" y="-96" width="152" height="192" rx="10" fill="#fafafa"/>
      <line x1="-132" y1="-56" x2="-32" y2="-56" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
      <line x1="-132" y1="-26" x2="-32" y2="-26" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
      <line x1="-132" y1="4" x2="-52" y2="4" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
      <line x1="-132" y1="34" x2="-62" y2="34" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="rotate(4)">
      <rect x="6" y="-96" width="152" height="192" rx="10" fill="#f1f5f9"/>
      <line x1="32" y1="-56" x2="132" y2="-56" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
      <line x1="32" y1="-26" x2="132" y2="-26" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
      <line x1="32" y1="4" x2="112" y2="4" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
      <line x1="32" y1="34" x2="102" y2="34" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Amber accent -->
  <circle cx="636" cy="238" r="9" fill="#d97706"/>

  <rect width="800" height="1000" fill="url(#vignette)"/>
</svg>
